<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Grão Dourado — CSS Interno</title>
    <style>

        body {
            background-color: #f5f5dc;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #6d3b0e;
            text-align: center;
            padding: 15px 10px;
        }

        header h1 {
            color: #ffffff;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            margin: 0 0 10px 0;
        }

        header p {
            color: #ffffff;
            margin: 0;
        }

        section {
            background-color: #ffffff;
            border: 2px solid #d29d67;
            border-radius: 10px;
            padding: 15px;
            margin: 15px;
        }

        
        section h3 {
            color: #6d3b0e;
            font-family: 'Courier New', Courier, monospace;
            margin-top: 0;
        }

     
        section p {
            color: #741a1a;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        main  {
            font-family: 'Times New Roman', Times, serif;
            margin: 0 auto;
            max-width: 800px;
        }
    

        
    </style>


</head>
<body>

  <header>

    <a href="../index.html" ><button

<a href="./sobre.html" ><button

  <main>
